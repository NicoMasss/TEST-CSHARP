<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    /* Aplicando a fonte globalmente */
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #000000;
        color: white;
    }

    .background-body {
        background-color: #000000;
    }

    .card-register {
        background-color: #1a1b1b !important;
        padding: 2rem;
        border-radius: 10px;
        color: white;
    }

    .label-register {
        color: white;
    }

    .form-label {
        color: #ffc107;
    }

    .btn-register {
        background-color: #ffc107;
        color: black;
        font-weight: bold;
        border: none;
    }

    .btn-register:hover {
        background-color: #e0a800;
    }

    .form-control {
        background-color: #3d4141;
        border: 1px solid #3d4141; /* borda cinza */
        color: white;
    }

    .form-control:focus {
        background-color: #3d4141;
        border: 1px solid #3d4141; /* mantém a mesma cor */
        box-shadow: none; /* remove o brilho azul do Bootstrap */
        outline: none; /* remove qualquer contorno extra */
        color: white;
    }

    /* Header */
    .header-design {
        background-color: #1a1b1b;
    }

    .navbar-brand {
        font-family: 'Poppins', sans-serif;
        color: #ffc107 !important;
    }

    .container {
        min-height: 100vh;
    }
  </style>
</head>
<body class="background-body">

<nav class="navbar navbar-dark px-3 header-design">
  <a class="navbar-brand d-flex align-items-center" href="home.html">
    <span class="fw-bold text-warning">MyTask</span>
  </a>
  <div class="ms-auto d-flex gap-2">
    <a href="login.html" class="btn btn-warning fw-bold">Login</a>
  </div>
</nav>

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4 card-register" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4 label-register">Create an Account</h3>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-register">Register</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</body>
</html>
