<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Task List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
    
    /* Aplicando a fonte globalmente */
    body {
      font-family: 'Poppins', sans-serif;
    }
    
    .background-body {
      background-color: #000000;
    }

    .card-tasks {
      background-color: #1a1b1b !important;
      border-radius: 10px;
    }

    .header-design {
      background-color: #1a1b1b;
    }

    .navbar-brand {
      font-family: 'Poppins', sans-serif;
    }

    .task-item {
      background-color: #3d4141;
      color: white;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
    }

    .task-item:hover {
      background-color: #444d4d;
    }

    .task-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .task-status {
      color: #ffc107;
    }

    .task-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-actions button {
      background-color: #dc3545;
      color: white;
      border: none;
    }

    .task-actions button:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body class="background-body">
  <nav class="navbar navbar-dark px-3 header-design">
    <a class="navbar-brand d-flex align-items-center" href="home.html">
      <span class="fw-bold text-warning">MyTask</span>
    </a>
    <div class="ms-auto">
      <a href="logout.html" class="btn btn-warning fw-bold">Logout</a>
    </div>
  </nav>

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4 card-tasks" style="width: 100%; max-width: 900px;">
      <h3 class="text-center mb-4 text-warning">Admin - Task List</h3>
      
      <!-- Tarefa 1 -->
      <div class="task-item">
        <div class="task-title">Task Title 1</div>
        <div class="task-info">
          <small class="text-muted">Posted by: User1</small>
        </div>
        <div class="task-status">
          Status: <span class="badge bg-warning text-dark">Incomplete</span>
        </div>
        <div class="task-actions">
          <button class="btn btn-sm">Delete Task</button>
        </div>
      </div>
      
      <!-- Tarefa 2 -->
      <div class="task-item">
        <div class="task-title">Task Title 2</div>
        <div class="task-info">
          <small class="text-muted">Posted by: User2</small>
        </div>
        <div class="task-status">
          Status: <span class="badge bg-success">Complete</span>
        </div>
        <div class="task-actions">
          <button class="btn btn-sm">Delete Task</button>
        </div>
      </div>

      <!-- Tarefa 3 -->
      <div class="task-item">
        <div class="task-title">Task Title 3</div>
        <div class="task-info">
          <small class="text-muted">Posted by: User3</small>
        </div>
        <div class="task-status">
          Status: <span class="badge bg-warning text-dark">Incomplete</span>
        </div>
        <div class="task-actions">
          <button class="btn btn-sm">Delete Task</button>
        </div>
      </div>

      <!-- Mais tarefas podem ser adicionadas aqui -->
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
