<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homepage - Gestão de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-dark text-white">

  <div class="container mt-5">
    <h1 class="text-center mb-4">Painel de Gestão</h1>

    <!-- Seção de Clientes -->
    <div class="mb-4">
      <h3>Clientes</h3>
      <button onclick="carregarClientes()" class="btn btn-primary mb-2">Atualizar Lista</button>

      <div class="input-group mb-3">
        <input type="text" id="buscarClienteId" class="form-control" placeholder="Buscar cliente por ID">
        <button class="btn btn-outline-light" onclick="buscarClientePorId()">Buscar</button>
      </div>

      <div class="row" id="clientes"></div>
    </div>

    <!-- Seção de Tarefas -->
    <div class="mb-4">
      <h3>Tarefas</h3>

      <div class="input-group mb-3">
        <input type="text" id="buscarTaskId" class="form-control" placeholder="Buscar task por ID">
        <button class="btn btn-outline-light" onclick="buscarTaskPorId()">Buscar</button>
      </div>

      <div class="input-group mb-3">
        <input type="text" id="buscarTarefasClienteId" class="form-control" placeholder="Buscar tarefas por ID do cliente">
        <button class="btn btn-outline-light" onclick="buscarTarefasPorCliente()">Buscar</button>
      </div>

      <div id="tarefas"></div>
    </div>

    <!-- Criar nova tarefa -->
    <div class="mb-4">
      <h3>Criar Nova Tarefa</h3>
      <input type="text" id="titulo" class="form-control mb-2" placeholder="Título">
      <input type="text" id="descricao" class="form-control mb-2" placeholder="Descrição">
      <input type="text" id="assignedTo" class="form-control mb-2" placeholder="ID do Cliente Responsável">
      <button onclick="criarTask()" class="btn btn-success">Criar Tarefa</button>
    </div>

    <!-- Criar novo cliente -->
    <div>
      <h3>Criar Novo Cliente</h3>
      <input type="text" id="novoNome" class="form-control mb-2" placeholder="Nome">
      <input type="text" id="novoEmail" class="form-control mb-2" placeholder="Email">
      <input type="password" id="novaSenha" class="form-control mb-2" placeholder="Senha">
      <button onclick="criarCliente()" class="btn btn-info">Criar Cliente</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
