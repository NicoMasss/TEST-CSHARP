<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Account - MyTasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap');

    /* Aplicando a fonte globalmente */
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #000000;
        color: white;
    }

    .background-body {
        background-color: #000000;
    }

    .card-task {
        background-color: #1a1b1b !important;
        padding: 2rem;
        border-radius: 10px;
        color: white;
    }

    .label-task {
        color: white;
    }

    .form-label {
        color: #ffc107;
    }

    .btn-submit-task {
        background-color: #ffc107;
        color: black;
        font-weight: bold;
        border: none;
    }

    .btn-submit-task:hover {
        background-color: #e0a800;
    }

    .form-control {
        background-color: #3d4141;
        border: 1px solid #3d4141;
        color: white;
    }

    .form-control:focus {
        background-color: #3d4141;
        border: 1px solid #3d4141;
        box-shadow: none;
        outline: none;
        color: white;
    }

    .task-list {
        margin-top: 2rem;
    }

    .task-item {
        background-color: #3d4141;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
    }

    .task-title {
        font-size: 1.2rem;
        color: #ffc107;
        font-weight: bold;
    }

    .task-description {
        color: #f1f1f1;
        margin-top: 0.5rem;
    }

    .task-due {
        font-size: 0.9rem;
        color: #f1f1f1;
        margin-top: 1rem;
    }

    /* Header */
    .header-design {
        background-color: #1a1b1b;
    }

    .navbar-brand {
        font-family: 'Poppins', sans-serif;
        color: #ffc107 !important;
    }

    .container {
        min-height: 100vh;
    }
  </style>
</head>
<body class="background-body">

  <nav class="navbar navbar-dark px-3 header-design">
    <a class="navbar-brand d-flex align-items-center" href="home.html">
      <span class="fw-bold text-warning">MyTask</span>
    </a>
  </nav>

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4 card-task" style="width: 100%; max-width: 600px;">
      <h3 class="text-center mb-4 label-task">Post a New Task</h3>
      <form>
        <div class="mb-3">
          <label for="taskTitle" class="form-label">Task Title</label>
          <input type="text" class="form-control" id="taskTitle" placeholder="" required>
        </div>
        <div class="mb-3">
          <label for="taskDescription" class="form-label">Task Description</label>
          <textarea class="form-control" id="taskDescription" rows="4" placeholder="" required></textarea>
        </div>
        <div class="mb-3">
          <label for="taskDueDate" class="form-label">Due Date</label>
          <input type="date" class="form-control" id="taskDueDate" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-submit-task">Add Task</button>
        </div>
      </form>
      
      <!-- Lista de tarefas postadas -->
      <div class="task-list">
        <h4 class="text-center text-warning">Your Tasks</h4>

        <!-- Exemplo de Tarefa -->
        

      </div>
    </div>
  </div>

</body>
</html>
